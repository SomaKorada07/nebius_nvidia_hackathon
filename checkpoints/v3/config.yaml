seed: 17

# Data
raw_dir: data/raw
standardized_dir: data/standardized
processed_dir: data/processed
artifacts_dir: artifacts
validation_fraction: 0.10      # BANKING77 validation carved from official train
unseen_label_fraction: 0.20    # labels held out of training for the unseen-label test
label_descriptions: data/label_descriptions.json   # one hand-written line per label, from its name only

# Embeddings
model_id: nvidia/Nemotron-3.5-Embed-1B-BF16
model_revision: c0f2e8ab5367f5090e6eed608f607bafe76d707b
model_dir: models/Nemotron-3.5-Embed-1B-BF16
embeddings_dir: artifacts/embeddings
candidate_text: name_description   # "name" (v1: raw label) or "name_description" (v2: "label: description")
device: auto                   # auto picks cuda, then mps, then cpu
dtype: bfloat16                # CPU falls back to float32
batch_size:                    # per device
  cuda: 128
  mps: 32
  cpu: 8
max_seq_length: 512

# Candidate sets and heads
candidate_sizes: [5, 10]
open_set_fraction: 0.30        # training sets with the gold label removed
hard_negative_fraction: 0.50   # training sets whose negatives are the gold label's nearest labels
head_hidden_dim: 256
epochs: 15
learning_rate: 0.001
train_batch_size: 256
early_stopping_patience: 3
permutations_per_example: 10

# Reflex v3: v2 scorer + NONE head from ranking evidence, trained on simulated unseen labels
pseudo_unseen_fraction: 0.20   # training labels treated as unseen when training the NONE head
none_holdout_fraction: 0.15    # base-label training texts kept from the scorer, for the NONE head
none_sets_per_group: 2000      # NONE-head sets per epoch for each {seen, pseudo-unseen} x {present, removed}
none_head_hidden_dim: 16
pair_match_weight: 1.0         # mu in: loss = ranking + mu * pair-match
