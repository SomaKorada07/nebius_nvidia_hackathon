<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="940" viewBox="0 0 1700 940" role="img" aria-labelledby="title desc">
  <title id="title">Reflex v3 three-stage training architecture</title>
  <desc id="desc">Training begins by splitting 182 labels into 146 base labels and 36 pseudo-unseen labels. Stage one trains a candidate scorer on base labels. Stage two freezes that scorer and trains the NONE head across seen and pseudo-unseen present and missing cases. Stage three trains a fresh scorer on all 182 labels and copies the NONE head unchanged. Forty-five real unseen labels are evaluation only.</desc>
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#0f766e"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#be123c"/></marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:#172033; }
      .title{font-size:31px;font-weight:760;fill:#fff}.sub{font-size:16px;fill:#dbeafe}.h{font-size:21px;font-weight:760}.label{font-size:15px;font-weight:700}.small{font-size:13px;fill:#475569}.tiny{font-size:11px;fill:#64748b}.mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:13px}.card{fill:#fff;stroke:#dbe2ea;stroke-width:1.5;filter:url(#sh)}.arrow{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arr)}.arrowT{fill:none;stroke:#0f766e;stroke-width:2.2;marker-end:url(#arrT)}.arrowR{fill:none;stroke:#be123c;stroke-width:2.2;marker-end:url(#arrR)}
    </style>
  </defs>
  <rect width="1700" height="940" fill="#f5f7fb"/>
  <rect x="28" y="24" width="1644" height="88" rx="20" fill="url(#hdr)"/>
  <text x="62" y="63" class="title">Reflex v3 · How the model learns unfamiliar candidates</text>
  <text x="62" y="91" class="sub">Train candidate matching and answer availability separately, then recombine them without exposing the real unseen labels</text>

  <rect x="28" y="136" width="1644" height="168" rx="22" class="card"/>
  <text x="58" y="174" class="h">0. Build a simulated open-world split</text>
  <rect x="60" y="198" width="272" height="72" rx="15" fill="#eef2ff" stroke="#818cf8"/>
  <text x="196" y="226" text-anchor="middle" class="label">182 training labels</text>
  <text x="196" y="251" text-anchor="middle" class="small">120 CLINC + 62 BANKING</text>
  <path d="M332 234 L374 234" class="arrow"/>
  <circle cx="380" cy="234" r="6" fill="#475569"/>
  <path d="M386 234 L414 234" class="arrowT"/>
  <rect x="420" y="188" width="307" height="92" rx="15" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="573" y="217" text-anchor="middle" class="label">146 base labels</text>
  <text x="573" y="241" text-anchor="middle" class="small">the first scorer may learn these</text>
  <text x="573" y="264" text-anchor="middle" class="tiny">15% of their texts held out for stage 2</text>
  <path d="M380 228 C500 158 704 158 805 210" class="arrowR"/>
  <rect x="812" y="188" width="307" height="92" rx="15" fill="#fff1f2" stroke="#fb7185"/>
  <text x="965" y="217" text-anchor="middle" class="label">36 pseudo-unseen labels</text>
  <text x="965" y="241" text-anchor="middle" class="small">hidden from the stage-1 scorer</text>
  <text x="965" y="264" text-anchor="middle" class="tiny">stand-ins for future new labels</text>
  <rect x="1261" y="188" width="361" height="92" rx="15" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="7 5"/>
  <text x="1441" y="217" text-anchor="middle" class="label">45 real unseen labels</text>
  <text x="1441" y="241" text-anchor="middle" class="small">30 CLINC + 15 BANKING</text>
  <text x="1441" y="264" text-anchor="middle" class="tiny">never train · never tune · evaluation only</text>

  <!-- three stages -->
  <rect x="28" y="330" width="506" height="432" rx="22" class="card"/>
  <circle cx="70" cy="374" r="23" fill="#0891b2"/><text x="70" y="381" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">1</text>
  <text x="107" y="370" class="h">Train candidate matching</text>
  <text x="107" y="394" class="small">Base labels only · scorer parameters update</text>
  <rect x="65" y="429" width="432" height="90" rx="16" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="281" y="457" text-anchor="middle" class="label">Shared candidate scorer</text>
  <text x="281" y="482" text-anchor="middle" class="mono">rᵢ → 8192 → 256 → 256 → zᵢ</text>
  <text x="281" y="505" text-anchor="middle" class="tiny">Nemotron embeddings remain frozen</text>
  <rect x="65" y="544" width="200" height="92" rx="15" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="165" y="573" text-anchor="middle" class="label">Ranking CE</text>
  <text x="165" y="597" text-anchor="middle" class="small">gold present only</text>
  <text x="165" y="619" text-anchor="middle" class="tiny">choose the best option</text>
  <rect x="297" y="544" width="200" height="92" rx="15" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="397" y="573" text-anchor="middle" class="label">Pair-match BCE</text>
  <text x="397" y="597" text-anchor="middle" class="small">every query-option pair</text>
  <text x="397" y="619" text-anchor="middle" class="tiny">stabilize absolute score scale</text>
  <path d="M281 519 L165 544" class="arrowT"/><path d="M281 519 L397 544" class="arrowT"/>
  <rect x="65" y="665" width="432" height="63" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="281" y="692" text-anchor="middle" class="label">Output: base scorer</text>
  <text x="281" y="715" text-anchor="middle" class="small">knows matching, has never seen 36 labels</text>

  <rect x="572" y="330" width="556" height="432" rx="22" class="card"/>
  <circle cx="614" cy="374" r="23" fill="#e11d48"/><text x="614" y="381" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">2</text>
  <text x="651" y="370" class="h">Teach the NONE behavior</text>
  <text x="651" y="394" class="small">Freeze scorer · update only the 129-parameter NONE net</text>
  <rect x="609" y="429" width="482" height="60" rx="15" fill="#fff1f2" stroke="#fda4af"/>
  <text x="850" y="455" text-anchor="middle" class="label">Balanced 2 × 2 training grid</text>
  <text x="850" y="477" text-anchor="middle" class="tiny">prevents “new candidate ⇒ NONE” as a shortcut</text>
  <rect x="609" y="510" width="225" height="72" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="721" y="538" text-anchor="middle" class="label">Seen · gold present</text>
  <text x="721" y="562" text-anchor="middle" class="small">choose candidate</text>
  <rect x="866" y="510" width="225" height="72" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="978" y="538" text-anchor="middle" class="label">Seen · gold removed</text>
  <text x="978" y="562" text-anchor="middle" class="small">choose NONE</text>
  <rect x="609" y="600" width="225" height="72" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="721" y="628" text-anchor="middle" class="label">Pseudo-new · present</text>
  <text x="721" y="652" text-anchor="middle" class="small">trust unfamiliar gold</text>
  <rect x="866" y="600" width="225" height="72" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="978" y="628" text-anchor="middle" class="label">Pseudo-new · removed</text>
  <text x="978" y="652" text-anchor="middle" class="small">reject near misses</text>
  <rect x="609" y="694" width="482" height="34" rx="17" fill="#ffe4e6"/>
  <text x="850" y="716" text-anchor="middle" class="small">6 ranking features → 16 hidden units → z_NONE</text>

  <rect x="1166" y="330" width="506" height="432" rx="22" class="card"/>
  <circle cx="1208" cy="374" r="23" fill="#16a34a"/><text x="1208" y="381" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">3</text>
  <text x="1245" y="370" class="h">Build the final model</text>
  <text x="1245" y="394" class="small">All 182 labels · real unseen labels still untouched</text>
  <rect x="1203" y="429" width="432" height="90" rx="16" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1419" y="457" text-anchor="middle" class="label">Train a fresh candidate scorer</text>
  <text x="1419" y="482" text-anchor="middle" class="small">same ranking CE + pair-match BCE</text>
  <text x="1419" y="505" text-anchor="middle" class="tiny">now learns from all 182 training labels</text>
  <path d="M1419 519 L1419 554" class="arrowT"/>
  <rect x="1203" y="558" width="432" height="72" rx="16" fill="#fff1f2" stroke="#fb7185"/>
  <text x="1419" y="586" text-anchor="middle" class="label">Copy NONE net from stage 2</text>
  <text x="1419" y="611" text-anchor="middle" class="small">unchanged · candidate scores stay detached</text>
  <path d="M1419 630 L1419 661" class="arrow"/>
  <rect x="1203" y="665" width="432" height="63" rx="15" fill="#f0fdf4" stroke="#86efac"/>
  <text x="1419" y="692" text-anchor="middle" class="label">Fit one temperature T</text>
  <text x="1419" y="715" text-anchor="middle" class="small">calibrate the final K + 1 softmax</text>

  <path d="M534 700 C551 700 553 700 572 700" class="arrowT"/>
  <path d="M1128 700 C1145 700 1147 700 1166 700" class="arrowR"/>

  <!-- final inference contract -->
  <rect x="28" y="790" width="1644" height="122" rx="22" class="card"/>
  <text x="58" y="829" class="h">Final inference contract</text>
  <rect x="372" y="816" width="246" height="61" rx="15" fill="#eef2ff" stroke="#818cf8"/>
  <text x="495" y="842" text-anchor="middle" class="label">Any K option texts</text>
  <text x="495" y="864" text-anchor="middle" class="tiny">including never-trained labels</text>
  <path d="M618 846 L691 846" class="arrow"/>
  <rect x="699" y="816" width="327" height="61" rx="15" fill="#ecfeff" stroke="#22d3ee"/>
  <text x="862" y="842" text-anchor="middle" class="label">Final scorer + transferred NONE net</text>
  <text x="862" y="864" text-anchor="middle" class="tiny">order-free · variable K · frozen encoder</text>
  <path d="M1026 846 L1099 846" class="arrow"/>
  <rect x="1107" y="816" width="319" height="61" rx="15" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1266" y="842" text-anchor="middle" class="label">Candidate i or NONE_OF_THESE</text>
  <text x="1266" y="864" text-anchor="middle" class="tiny">one calibrated K + 1 softmax</text>
  <text x="58" y="893" class="tiny">The central trick: stage 2 creates the only supervision that explicitly teaches correct behavior when candidate labels are unfamiliar.</text>
</svg>
